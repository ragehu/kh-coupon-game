<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#00aeef" />
<title>K&H – Szabadítsd ki a 20%-os kedvezményt!</title>
<style>
  :root{
    --kh-cyan:#00aeef;
    --kh-blue:#007cc3;
    --kh-dark:#003767;
    --kh-orange:#f58220;
    --kh-light:#d1e8fa;
    --kh-pale:#f2fbff;
    --ink:#11334d;
    --shadow:0 18px 54px rgba(0,55,103,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#edf8fd;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
  body{display:flex;justify-content:center;align-items:flex-start;padding:clamp(10px,2.5vw,28px);padding-top:max(clamp(10px,2.5vw,28px),env(safe-area-inset-top));padding-bottom:max(clamp(10px,2.5vw,28px),env(safe-area-inset-bottom));overflow-x:hidden}
  button,a{font:inherit}
  .app{width:min(100%,1040px);position:relative}
  .frame{position:relative;background:#fff;border-radius:30px;box-shadow:var(--shadow);overflow:hidden;border:1px solid rgba(0,124,195,.12)}
  canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;background:#eaf9ff;touch-action:none;user-select:none;-webkit-user-select:none}
  .topbar{position:absolute;left:0;top:0;right:0;height:78px;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;pointer-events:none;z-index:5}
  .brand{display:flex;align-items:center;gap:10px;filter:drop-shadow(0 4px 10px rgba(0,55,103,.10))}
  .logo-card{background:#fff;border-radius:15px;padding:7px 10px 6px;box-shadow:0 7px 20px rgba(0,55,103,.12)}
  .logo{width:76px;height:45px;display:block}
  .sound-btn{pointer-events:auto;border:0;background:#fff;color:var(--kh-dark);border-radius:999px;min-height:42px;padding:0 14px;font-weight:800;box-shadow:0 6px 18px rgba(0,55,103,.14);cursor:pointer}
  .sound-btn:focus-visible,.btn:focus-visible,.copy-btn:focus-visible{outline:3px solid rgba(245,130,32,.45);outline-offset:2px}

  .screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:92px 32px 28px;z-index:10;background:linear-gradient(145deg,rgba(242,251,255,.97),rgba(209,232,250,.95));transition:opacity .28s ease,visibility .28s ease}
  .screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .hero{width:min(760px,100%);text-align:center;position:relative}
  .eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--kh-orange);font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:13px;margin-bottom:10px}
  .chev{font-size:22px;line-height:1;letter-spacing:-7px;margin-right:5px}
  h1{font-size:clamp(31px,5vw,58px);line-height:.98;margin:0;color:var(--kh-dark);letter-spacing:-.045em}
  h1 .pct{color:var(--kh-cyan)}
  .lead{font-size:clamp(16px,2vw,20px);line-height:1.45;max-width:640px;margin:18px auto 22px;color:#315a73}
  .travel-strip{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;margin:18px auto 26px;color:var(--kh-blue)}
  .travel-chip{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid rgba(0,124,195,.15);border-radius:999px;padding:8px 11px;font-weight:700;font-size:13px;box-shadow:0 4px 14px rgba(0,55,103,.06)}
  .btn{border:0;border-radius:14px;min-height:52px;padding:0 24px;background:var(--kh-orange);color:#fff;font-weight:900;font-size:17px;cursor:pointer;box-shadow:0 10px 25px rgba(245,130,32,.28);transition:transform .14s ease,filter .14s ease}
  .btn:hover{filter:brightness(1.03)} .btn:active{transform:translateY(1px) scale(.99)}
  .how{margin-top:14px;font-size:13px;color:#55768a}
  .plane-line{position:absolute;pointer-events:none;opacity:.18;inset:-34px 0 auto;overflow:hidden;height:150px}
  .plane-line svg{width:100%;height:100%}

  .win-screen{background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(223,247,255,.97));padding-top:88px}
  .time-result{display:inline-flex;align-items:center;justify-content:center;min-height:34px;margin:12px auto 0;padding:7px 12px;border-radius:999px;background:rgba(0,174,239,.09);border:1px solid rgba(0,124,195,.16);color:var(--kh-dark);font-weight:900;font-size:13px;letter-spacing:.02em}
  .coupon{position:relative;width:min(620px,100%);margin:15px auto 18px;background:#fff;border:2px solid var(--kh-cyan);border-radius:22px;padding:22px 22px 24px;box-shadow:0 20px 50px rgba(0,55,103,.16);overflow:hidden}
  .coupon:before,.coupon:after{content:"";position:absolute;width:32px;height:32px;background:#e7f7fd;border:2px solid var(--kh-cyan);border-radius:50%;top:50%;transform:translateY(-50%)}
  .coupon:before{left:-18px}.coupon:after{right:-18px}
  .coupon-kicker{font-weight:900;color:var(--kh-orange);letter-spacing:.06em;text-transform:uppercase;font-size:13px}
  .coupon-value{font-weight:900;color:var(--kh-dark);font-size:clamp(37px,7vw,68px);line-height:1;margin:6px 0 4px;letter-spacing:-.04em}
  .coupon-value span{color:var(--kh-cyan)}
  .coupon-label{font-weight:800;color:#486d83;margin-bottom:16px}
  .code-row{display:flex;gap:10px;justify-content:center;align-items:stretch;flex-wrap:wrap}
  .code{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:12px;background:#ecf9fe;color:var(--kh-dark);font:900 22px/1 monospace;letter-spacing:.08em;border:1px dashed rgba(0,124,195,.5)}
  .copy-btn{border:0;border-radius:12px;padding:0 17px;background:var(--kh-cyan);color:#fff;font-weight:900;cursor:pointer;min-height:52px}
  .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
  .btn.secondary{background:#fff;color:var(--kh-dark);border:1px solid rgba(0,124,195,.22);box-shadow:none}
  .micro-link-wrap{margin:16px auto 0;max-width:620px}
  .micro-link{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:12px 16px;border-radius:14px;background:rgba(0,174,239,.08);border:1px solid rgba(0,124,195,.18);color:var(--kh-dark);font-weight:800;font-size:14px;line-height:1.35;text-decoration:none;transition:background .14s ease,transform .14s ease}
  .micro-link:hover{background:rgba(0,174,239,.13)}
  .micro-link:active{transform:translateY(1px)}
  .micro-link:focus-visible{outline:3px solid rgba(245,130,32,.45);outline-offset:2px}
  .micro-link .arrow{color:var(--kh-orange);font-size:19px;line-height:1}
  .disclaimer{font-size:11px;line-height:1.45;color:#67879b;max-width:680px;margin:14px auto 0}

  .gameover-card{width:min(620px,100%);text-align:center;background:#fff;border-radius:24px;padding:26px;box-shadow:var(--shadow);border:1px solid rgba(0,124,195,.13)}
  .gameover-card h2{color:var(--kh-dark);font-size:clamp(28px,5vw,44px);margin:0 0 8px}
  .gameover-card p{color:#527487;line-height:1.5;margin:0 0 18px}

  @media(max-width:640px){
    body{padding:0;background:#fff}
    .frame{border-radius:0;border:0;box-shadow:none;min-height:100svh}
    .screen{padding:82px 18px 22px}
    .topbar{height:68px;padding:9px 11px}
    .logo-card{padding:5px 8px}.logo{width:66px;height:39px}
    .sound-btn{min-height:40px;padding:0 12px;font-size:13px}
    .travel-strip{gap:7px}.travel-chip{padding:7px 9px;font-size:12px}
    .coupon{padding:18px 16px 20px}
  }
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.screen{transition:none}}
</style>
</head>
